<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Localizador de NAPS - PMESP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Leaflet (já vamos deixar preparado) -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <div class="container">

        <header>

    <img src="imagens/logo-pmesp.png"
     alt="Brasão PMESP"
     class="logo">

    <h1>LOCALIZADOR DE NAPS</h1>

    <p class="subtitulo">
        Sistema de localização dos Núcleos de Apoio Psicossocial
    </p>

</header>

        <section class="busca">

            <button id="btnLocalizacao">
                📍 Usar minha localização
            </button>

            <span>ou</span>

            <input
                type="text"
                id="cep"
                placeholder="Digite seu CEP">

            <button id="btnBuscar">
                Pesquisar
            </button>

        </section>
<section id="mapaContainer">

    <h3>Mapa</h3>

    <div id="mapa"></div>

</section>
        <section id="resultado">

            <h3>Resultado</h3>

            <div id="dadosResultado">

                Nenhuma pesquisa realizada.

            </div>

        </section>

    </div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="script.js"></script>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
